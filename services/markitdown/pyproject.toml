[project]
name = "wikiplane-markitdown-service"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.7.0",
  "markitdown[pdf]>=0.1.8,<0.2.0"
]

[project.optional-dependencies]
test = ["pytest>=8.0", "httpx2>=2.5,<3"]

[tool.pytest.ini_options]
pythonpath = ["src"]
